<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 96" fill="none">
  <!-- Mark group -->
  <g transform="translate(4, 2) scale(0.92)">
    <!-- Top binder rings -->
    <rect x="23" y="6" width="9" height="18" rx="4.5" fill="#bada55" />
    <rect x="68" y="6" width="9" height="18" rx="4.5" fill="#bada55" />

    <!-- Calendar Outer Header & Frame -->
    <rect x="12" y="14" width="76" height="74" rx="16" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="2" />
    
    <!-- Calendar Interior -->
    <rect x="18" y="30" width="64" height="52" rx="10" fill="#ffffff" />

    <!-- Schedule Lines -->
    <rect x="52" y="37" width="22" height="5.5" rx="2.75" fill="#9cba2f" />
    <rect x="52" y="46" width="22" height="5.5" rx="2.75" fill="#9cba2f" />
    <rect x="52" y="55" width="16" height="5.5" rx="2.75" fill="#9cba2f" />

    <!-- Doctor Silhouette -->
    <circle cx="35" cy="46" r="9.5" fill="#351d5b" />
    <path d="M 18 80 C 18 64 24 60 35 60 C 46 60 52 64 52 80 Z" fill="#351d5b" />
    <!-- Stethoscope -->
    <path d="M 29 65 C 29 73.5 39 73.5 39 65" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M 39 70.5 L 42 73.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="43.5" cy="75" r="2.2" fill="#ffffff" />

    <!-- Verified Check Badge -->
    <circle cx="71" cy="71" r="16" fill="#bada55" />
    <path d="M 64.5 71 L 69 75.5 L 78 66" stroke="#1c2406" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Typography -->
  <text x="106" y="56" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-1">Doc</text>
  <text x="194" y="56" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#bada55" letter-spacing="-1">Connect</text>
  <text x="108" y="78" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="rgba(255, 255, 255, 0.85)" letter-spacing="0.3">Book Appointments. Better Health.</text>
</svg>
