name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://docconnect-api.mills.co.ke
          VITE_WEB_BASE_URL: https://docconnect.mills.co.ke
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
